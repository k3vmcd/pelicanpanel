services:
  panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: pelican-panel
    restart: always
    depends_on:
      - wings
    networks:
      - pelican
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      DOCKER_SUBNET: ${DOCKER_SUBNET:-172.21.0.0/16}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-256M}

  wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: always
    networks:
      - pelican
    ports:
      - "${WINGS_HTTP_PORT:-8080}:8080"
      - "${WINGS_SFTP_PORT:-2022}:2022"
    tty: true
    environment:
      TZ: ${TZ:-UTC}
      WINGS_UID: ${WINGS_UID:-988}
      WINGS_GID: ${WINGS_GID:-988}
      WINGS_USERNAME: ${WINGS_USERNAME:-pelican}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./wings/config:/etc/pelican
      - ./wings/data:/var/lib/pelican
      - ./wings/logs:/var/log/pelican
      - ./wings/tmp:/tmp/pelican
      - wings-runtime:/var/run/wings

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    networks:
      - pelican
    depends_on:
      - panel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pelican-data:
  pelican-logs:
  wings-runtime:

networks:
  pelican:
    name: pelican
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.21.0.0/16}
